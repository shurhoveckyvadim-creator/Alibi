name: Alibi v17 content and transparent logo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/content-v17.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow==11.3.0
      - shell: python
        run: |
          from pathlib import Path
          import hashlib,re,html,base64
          from collections import deque
          from PIL import Image,ImageDraw,ImageFilter
          def sha(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          p,c,l=Path('index.html'),Path('styles.css'),Path('assets/images/logo.png')
          assert sha(p.read_bytes())=='d86281e746f72290349a984c00597036ba3ae4a8'
          assert sha(c.read_bytes())=='10aa4814cfff6e9c6779cb19e0287c98f676f703'
          assert sha(l.read_bytes())=='48d5931ab13d1adf298d58342f87bf0c3d8361cb'
          s,css=p.read_text(encoding='utf-8'),c.read_text(encoding='utf-8')
          def sub(a,b,n=1):
              global s
              assert s.count(a)==n,a
              s=s.replace(a,b)
          u='https://clck.ru/3WWwAX'
          sub('ул. Воронежская, 47/14','ул. Воронежская, 47/14 · ЖК «Фонтаны»',2)
          sub('Адрес из макета · требует проверки','Адрес')
          sub('Уточняются перед публикацией','11:00–22:00')
          sub('ДЕМО ЛЕНДИНГА · ВЕРСИЯ 16 · Данные требуют согласования','ДЕМО ЛЕНДИНГА · ВЕРСИЯ 17')
          sub('· v16</title>','· v17</title>');sub('Демо-версия 16','Демо-версия 17')
          for label in ['Записаться на стрижку','Выбрать услугу и записаться','Записаться в Алиби']:
              sub('href="#contacts">'+label,'href="'+u+'" target="_blank" rel="noopener noreferrer">'+label)
          a=s.index('<div class="service">');b=s.index('<div class="actions">',a)
          assert 'Демонстрационный список.' in s[a:b]
          cards=[]
          for title,values in [('Младший барбер',[1000,500,1500]),('Старший барбер',[1700,900,2600])]:
              rows=''.join('<div class="price-line"><span>'+name+'</span><span class="price-amount">'+format(v,',').replace(',','\u202f')+'\u00a0₽</span></div>' for name,v in zip(['Стрижка','Борода','Комбо'],values))
              cards.append('<article class="price-group"><h3>'+title+'</h3>'+rows+'</article>')
          s=s[:a]+'<div class="price-groups">'+''.join(cards)+'</div><p class="price-explanation">Комбо — стрижка и оформление бороды.</p>'+s[b:]
          reviews=['Таня, лучший мастер которого когда либо встречал, аккуратно заботливо делает свою работу, предлагает отличные решения по дизайну стрижки, великолепный музыкальный репертуар в заведении','Отличная стрижка, как всегда! Мой топ мастер в своей работе - виртуоз. Очень порадовала и новая локация - стильно, удобно и приятная атмосфера. Однозначно рекомендую.','Нужна стрижка? Подровнять бороду? Однозначно тебе сюда! Таня творит магию и заряжает настроением! Атмосфера, профессионализм на высшем уровне уже несколько лет хожу к Тане на стрижку, а теперь и в удобной локации!','Если хотите получить идеальный результат, то вам точно сюда. Работает исключительный профессионал своего дела. Обстановка отличная, все новое.','Однозначно рекомендую, очень хорошо стригут. А как воском волосы дёргают, мама дорогая. Ставлю лайк','Ручки у Татьяны маленькие, но стригут блестяще! В очередной раз убеждаюсь что дело мастера боится, а от Татьяны даже волосы начинают расти как ей надо']
          old='<div class="placeholder"><h3>Здесь будут истории наших гостей.</h3><p>В демо нет вымышленных отзывов и рейтингов. Этот блок заполним реальными отзывами со ссылкой на подтверждённую карточку барбершопа.</p></div>'
          sub(old,'<div class="guest-reviews" aria-label="Отзывы гостей">'+''.join('<blockquote class="guest-review"><p>'+html.escape(t)+'</p></blockquote>' for t in reviews)+'</div>')
          icons=[('WhatsApp','https://clck.ru/3WWvSE','<path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.5L3 20.5l1.3-4.8A8.5 8.5 0 1 1 20.5 11.7Z"/><path d="M8.5 7.5c-.7 0-1.2.8-1 1.8.5 2.8 3.5 5.8 6.2 6.2 1 .2 1.8-.3 1.8-1l-2-1.2-.9.8c-1.7-.7-2.9-1.9-3.5-3.5l.8-.9Z"/>'),('Telegram','https://t.me/Alibi_krd','<path d="m3 10.5 17.5-6-3 15-5.3-4.2-3 2.6.6-5.3 7-5-9 4-4.8-1.1Z"/>'),('Instagram','https://www.instagram.com/alibi_krd?dlrf=MWR2Y2lxcnpsa3piNQ%3D%3D&utm_source=qr','<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.7" r=".8" fill="currentColor" stroke="none"/>')]
          socials='<div class="social-links" aria-label="Социальные сети и мессенджеры">'+''.join('<a class="social-link" href="'+html.escape(link,quote=True)+'" target="_blank" rel="noopener noreferrer" aria-label="Открыть '+name+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+svg+'</svg><span>'+name+'</span></a>' for name,link,svg in icons)+'</div>'
          sub('<p class="note">Кнопку онлайн-записи подключим после получения ссылки на сервис.</p>','<div class="actions"><a class="btn" href="'+u+'" target="_blank" rel="noopener noreferrer">Записаться онлайн</a></div>'+socials)
          sub('Для загрузки карты нужен интернет. В демо используется поиск: точную карточку организации и адрес нужно подтвердить.','Яндекс Карта: поиск по адресу. Для загрузки карты нужен интернет.')
          css+='''
          /* v17: confirmed prices, reviews and social links. */
          .price-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
          .price-group{min-width:0;padding:28px;border:1px solid #c2a56a55;border-radius:16px;background:#1017291a}
          .price-group h3{margin:0 0 18px;font:400 27px/1.35 'Renaissance',serif;color:#c2a56a}
          .price-line{display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:16px;align-items:baseline;padding:17px 0;border-bottom:1px solid #ffffff20;font-size:21px;line-height:1.45;letter-spacing:.25px}
          .price-line:last-child{border-bottom:0}
          .price-amount{white-space:nowrap;color:#c2a56a;text-align:right;font-variant-numeric:tabular-nums}
          .price-explanation{font-size:16px;color:#b7b7af;margin-top:18px}
          .reviews>.grid{align-items:start}.guest-reviews{display:grid;gap:16px;min-width:0}
          .guest-review{margin:0;padding:24px 26px;border:1px solid #c2a56a44;border-radius:16px;background:#1017291a}
          .guest-review p{margin:0;max-width:none;font-size:18px;line-height:1.7;overflow-wrap:break-word}
          .header-address span:last-child{max-width:290px;text-align:right}
          .social-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
          .social-link{display:inline-flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid #c2a56a66;border-radius:12px;color:#c2a56a;font-size:16px;line-height:1.4;transition:background .2s,border-color .2s}
          .social-link svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
          .social-link:hover{background:#c2a56a14;border-color:#c2a56a;filter:none}
          @media(max-width:760px){.price-groups{grid-template-columns:1fr;gap:18px}.price-group{padding:22px}.price-group h3{font-size:25px}.price-line{font-size:20px;gap:12px}.guest-review{padding:22px}.header-address span:last-child{max-width:100%;text-align:center}.social-link{font-size:16px;padding:12px 14px}}
          @media(max-width:360px){.price-group{padding:18px}.price-line{font-size:19px;gap:10px}}
          @media(prefers-reduced-motion:reduce){.social-link{transition:none}}
          '''
          image=Image.open(l).convert('RGBA');w,h=image.size
          edge=Image.new('L',(w,h),0)
          edge.putdata([255 if r>100 and g>75 and b<r*.8 and g>r*.65 else 0 for r,g,b,a in image.getdata()])
          ImageDraw.floodfill(edge,(0,0),128)
          pix=list(edge.getdata());seen=set();largest=[]
          for i,v in enumerate(pix):
              if v==128 or i in seen: continue
              q=deque([i]);seen.add(i);component=[]
              while q:
                  j=q.popleft();component.append(j);x,y=j%w,j//w
                  for nx,ny in [(x-1,y),(x+1,y),(x,y-1),(x,y+1)]:
                      k=ny*w+nx
                      if 0<=nx<w and 0<=ny<h and k not in seen and pix[k]!=128:
                          seen.add(k);q.append(k)
              if len(component)>len(largest):largest=component
          assert .60<len(largest)/(w*h)<.90,'Shield mask invalid.'
          mask=Image.new('L',(w,h),0);m=[0]*(w*h)
          for i in largest:m[i]=255
          mask.putdata(m);bounds=mask.getbbox();mask=mask.filter(ImageFilter.GaussianBlur(.4))
          image.putalpha(mask);image=image.crop(bounds)
          alpha=image.getchannel('A')
          assert all(alpha.getpixel(xy)==0 for xy in [(0,0),(image.width-1,0),(0,image.height-1),(image.width-1,image.height-1)])
          assert s.count('class="price-line"')==6 and s.count('class="guest-review"')==6 and s.count('href="'+u+'"')==4
          assert 'Цена уточняется' not in s and 'требует проверки' not in s
          image.save(l,format='PNG');p.write_text(s,encoding='utf-8');c.write_text(css,encoding='utf-8')
          root=Path.cwd().resolve()
          def embed(path):
              f=(root/path).resolve()
              assert f.is_relative_to(root/'assets') and f.is_file()
              mime={'.woff':'font/woff','.png':'image/png'}[f.suffix]
              return 'data:'+mime+';base64,'+base64.b64encode(f.read_bytes()).decode()
          packed=re.sub(r'url\((assets/[^)]+)\)',lambda m:'url('+embed(m.group(1))+')',css)
          preview=s.replace('<link rel="stylesheet" href="styles.css">','<style>'+packed+'</style>')
          preview=re.sub(r'src="(assets/[^"]+)"',lambda m:'src="'+embed(m.group(1))+'"',preview)
          assert 'src="assets/' not in preview and 'url(assets/' not in preview
          Path('dist').mkdir(exist_ok=True);Path('dist/alibi-preview.html').write_text(preview,encoding='utf-8')
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css assets/images/logo.png dist/alibi-preview.html
          git commit -m 'Apply v17 content, transparent shield logo and standalone preview'
          git push origin HEAD:main
