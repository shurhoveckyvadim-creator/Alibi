name: Responsive hero and contextual booking
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hero-booking.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alibi-hero-booking
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4==4.13.4 html5lib==1.1
      - shell: python
        run: |
          from pathlib import Path
          import re, base64, json
          from bs4 import BeautifulSoup
          p=Path('index.html')
          soup=BeautifulSoup(p.read_text(encoding='utf-8'),'html5lib')
          sticky=soup.select_one('a.btn.mobile')
          assert sticky is not None
          sticky['hidden']=''
          booking=sticky['href']
          targets=[a for a in soup.select('a.btn:not(.mobile)') if a.get('href')==booking or a.get('href','').startswith('tel:')]
          assert len(targets)>=3
          for a in targets:
              a['data-booking-cta']=''
          old=soup.find('script',id='responsive-booking')
          if old:
              old.decompose()
          js='''(()=>{
          'use strict';
          const root=document.documentElement;
          const header=document.querySelector('body > header');
          const sticky=document.querySelector('a.btn.mobile');
          const targets=[...document.querySelectorAll('[data-booking-cta]')];
          if(!sticky||!header)return;
          const mobile=matchMedia('(max-width:760px)');
          let frame=0;
          const visible=el=>{
            const style=getComputedStyle(el);
            if(style.display==='none'||style.visibility==='hidden'||Number(style.opacity)===0)return false;
            const r=el.getBoundingClientRect();
            const v=window.visualViewport;
            const top=v?v.offsetTop:0,left=v?v.offsetLeft:0;
            const height=v?v.height:document.documentElement.clientHeight;
            const width=v?v.width:document.documentElement.clientWidth;
            return r.width>0&&r.height>0&&r.bottom>top&&r.top<top+height&&r.right>left&&r.left<left+width;
          };
          const update=()=>{
            frame=0;
            const next=Math.ceil(header.getBoundingClientRect().height)+'px';
            if(root.style.getPropertyValue('--site-header-height')!==next)root.style.setProperty('--site-header-height',next);
            sticky.hidden=!(mobile.matches&&window.scrollY>8&&!targets.some(visible));
          };
          const schedule=()=>{if(!frame)frame=requestAnimationFrame(update);};
          window.addEventListener('scroll',schedule,{passive:true});
          window.addEventListener('resize',schedule,{passive:true});
          window.addEventListener('pageshow',schedule);
          window.addEventListener('load',schedule,{once:true});
          mobile.addEventListener('change',schedule);
          if(window.visualViewport){
            visualViewport.addEventListener('resize',schedule,{passive:true});
            visualViewport.addEventListener('scroll',schedule,{passive:true});
          }
          if('IntersectionObserver' in window){
            const observer=new IntersectionObserver(schedule,{threshold:0});
            targets.forEach(el=>observer.observe(el));
          }
          if('ResizeObserver' in window){
            const sizes=new ResizeObserver(schedule);
            sizes.observe(header);targets.forEach(el=>sizes.observe(el));
          }
          if(document.fonts)document.fonts.ready.then(schedule);
          update();
          })();'''
          script=soup.new_tag('script',id='responsive-booking')
          script.string=js
          soup.body.append(script)
          css_path=Path('styles.css')
          css=css_path.read_text(encoding='utf-8')
          css=re.sub(r'/\* BEGIN responsive hero booking \*/.*?/\* END responsive hero booking \*/','',css,flags=re.S)
          patch='''/* BEGIN responsive hero booking */
          :root{--site-header-height:140px}
          .hero{min-height:calc(100vh - var(--site-header-height));min-height:calc(100svh - var(--site-header-height));display:flex;align-items:center;padding:clamp(32px,6vh,72px) 0;overflow:visible}
          .hero > .wrap{width:100%;display:flex;flex-direction:column;gap:clamp(24px,4vh,40px)}
          .hero-copy{width:100%;max-width:850px;min-width:0}
          .hero h1{font-size:clamp(46px,5.6vw,76px);line-height:1.08;margin:0 0 24px;letter-spacing:-.025em;overflow-wrap:break-word}
          .hero .eyebrow{margin:0 0 20px;max-width:100%;line-height:1.6}
          .hero p{margin:0 0 16px;max-width:620px}
          .hero .intro{font-size:21px;line-height:1.6}
          .hero .actions{margin-top:24px;gap:12px}
          .hero .actions > .btn{min-width:0;white-space:normal;text-align:center}
          .hero .benefits{margin:0;justify-content:flex-start;flex-wrap:wrap;gap:12px 28px;text-align:left}
          .hero .benefits li{font-size:clamp(18px,2vw,26px);line-height:1.5}
          a.btn.mobile[hidden]{display:none!important}
          @media(min-width:761px) and (max-width:1100px){.nav{flex-wrap:wrap;row-gap:12px}.header-address{margin-left:auto}}
          @media(max-width:760px){
            :root{--site-header-height:190px}
            .nav{padding:12px 0;row-gap:8px}
            .nav nav{flex-wrap:wrap;column-gap:clamp(12px,4vw,22px);row-gap:0;font-size:15px}
            .nav nav a{display:inline-flex;align-items:center;min-height:44px}
            .header-address{font-size:15px;line-height:1.4;gap:2px 8px}
            .header-address span:first-child{font-size:14px}
            .hero{padding:28px 0 32px}
            .hero > .wrap{gap:24px}
            .hero h1{font-size:clamp(36px,8.2vw,58px);margin-bottom:20px}
            .hero .eyebrow{font-size:12px;letter-spacing:1.2px;margin-bottom:16px}
            .hero p{font-size:17px;line-height:1.6;margin-bottom:12px}
            .hero .intro{font-size:19px;line-height:1.55}
            .hero .actions{margin-top:20px;gap:10px}
            .hero .actions > .btn{flex:1 1 145px;font-size:15px;padding:12px 14px;min-height:48px}
            .hero .benefits{column-gap:18px;row-gap:8px}
            .hero .benefits li{font-size:clamp(13px,3.4vw,18px);gap:5px}
            a.btn.mobile{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:16px;right:16px;min-height:48px}
          }
          @media(max-height:600px) and (min-width:761px){.hero{padding:28px 0}.hero h1{font-size:clamp(42px,5vw,60px)}}
          /* END responsive hero booking */'''
          css=css.rstrip()+'\n\n'+patch+'\n'
          assert len(soup.select('#responsive-booking'))==1
          assert soup.select_one('a.btn.mobile').has_attr('hidden')
          assert len(soup.select('[data-booking-cta]'))==len(targets)
          p.write_text(soup.decode(formatter='html'),encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')
          root=Path.cwd().resolve()
          mime={'.woff':'font/woff','.woff2':'font/woff2','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.svg':'image/svg+xml'}
          def embed(path):
              f=(root/path).resolve()
              assert f.is_relative_to(root/'assets') and f.is_file(),path
              return 'data:'+mime[f.suffix.lower()]+';base64,'+base64.b64encode(f.read_bytes()).decode()
          packed=re.sub(r'url\([\'"]?(assets/[^)\'"]+)[\'"]?\)',lambda m:'url('+embed(m.group(1))+')',css)
          preview=BeautifulSoup(str(soup),'html5lib')
          link=preview.find('link',rel='stylesheet')
          style=preview.new_tag('style');style.string=packed;link.replace_with(style)
          for image in preview.find_all('img',src=True):
              if image['src'].startswith('assets/'):
                  image['src']=embed(image['src'])
          Path('dist').mkdir(exist_ok=True)
          Path('dist/alibi-preview.html').write_text(preview.decode(formatter='html'),encoding='utf-8')
          Path('dist/hero-booking-validation.json').write_text(json.dumps({'booking_targets':len(targets),'sticky_initially_hidden':True,'browser_checked':False,'checks':'static only'},indent=2),encoding='utf-8')
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css dist/alibi-preview.html dist/hero-booking-validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: responsive first screen and contextual mobile booking button'
          git push origin HEAD:main
