name: Structure existing Alibi project
on:
  push:
    branches: [main]
    paths: ['.github/workflows/structure-project.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original assets and verify reconstruction
        shell: python
        run: |
          from pathlib import Path
          import re, base64, hashlib
          source = Path('alibi-demo-v15.html')
          if not source.exists():
              raise SystemExit('Source v15 is missing; no files changed.')
          raw = source.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert blob == 'aa0d134d0e4d39ec1b56d99512eebdc7b1c85a9a', 'Source changed; refusing migration.'
          original = raw.decode('utf-8')
          matches = list(re.finditer(r'data:([^;,]+);base64,([A-Za-z0-9+/=]+)', original))
          assert [m.group(1) for m in matches] == ['font/woff', 'font/woff', 'image/png']
          paths = ['assets/fonts/renaissance.woff', 'assets/fonts/alibi-sign.woff', 'assets/images/logo.png']
          expected = [21472, 3072, 104495]
          assets = {}
          text = original
          for match, path, size in zip(matches, paths, expected):
              data = base64.b64decode(match.group(2), validate=True)
              assert len(data) == size
              assets[path] = data
              text = text.replace(match.group(0), path)
          style = re.search(r'<style>(.*?)</style>', text, re.S)
          assert style and text.count('<style>') == 1
          css = style.group(1)
          html = text[:style.start()] + '<link rel="stylesheet" href="styles.css">' + text[style.end():]
          labels = {'ВЕРСИЯ 15': 'ВЕРСИЯ 16', 'Демо-версия 15': 'Демо-версия 16', '· v15</title>': '· v16</title>'}
          for old, new in labels.items():
              assert html.count(old) == 1
              html = html.replace(old, new)
          rebuilt = html.replace('<link rel="stylesheet" href="styles.css">', '<style>' + css + '</style>')
          for old, new in labels.items():
              rebuilt = rebuilt.replace(new, old)
          for match, path in zip(matches, paths):
              rebuilt = rebuilt.replace(path, match.group(0))
          assert rebuilt.encode('utf-8') == raw, 'Round-trip verification failed.'
          files = {'index.html': html.encode('utf-8'), 'styles.css': css.encode('utf-8'), **assets}
          license_match = re.search(r'/\* Renaissance: (.*?) \*/', css, re.S)
          assert license_match
          files['licenses/Renaissance-License.txt'] = license_match.group(1).replace(' | ', '\n').encode('utf-8')
          files['README.md'] = ('# Алиби\n\nЕдинственный HTML-исходник: index.html. Стили: styles.css.\nИзображение и шрифты находятся в assets; пути относительные.\n\nРаспакуйте или скачайте весь проект и откройте index.html. Если браузер блокирует локальные шрифты, используйте HTTP-предпросмотр. Для карты нужен интернет.\nGitHub хранит исходники; эта операция не публикует сайт в интернете.\n\nРедакция v16 получена из v15 без изменения дизайна. Исходный v15 сохранён в истории Git. Извлечённые ресурсы побайтно идентичны исходным; обратная сборка проверена.\n').encode('utf-8')
          assert all(not Path(path).exists() for path in files), 'Destination files exist; refusing overwrite.'
          for path, data in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              assert target.read_bytes() == data
          source.unlink()
      - name: Commit the verified project structure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css assets licenses README.md alibi-demo-v15.html
          git commit -m 'Extract v15 resources into structured v16 project; remove duplicate HTML'
          git push origin HEAD:main
