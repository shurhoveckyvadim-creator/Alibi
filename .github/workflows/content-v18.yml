name: Alibi v18 repaired
on:
  push:
    branches: [main]
    paths: ['.github/workflows/content-v18.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4==4.13.4 html5lib==1.1
      - shell: python
        run: |
          from pathlib import Path
          import re, json, base64
          from bs4 import BeautifulSoup
          import html5lib
          p,c=Path('index.html'),Path('styles.css')
          soup=BeautifulSoup(p.read_text(encoding='utf-8'),'html5lib')
          assert 'ВЕРСИЯ 17' in soup.get_text()
          reviews=soup.select('.guest-review')
          assert len(reviews)==6
          soup.title.string='Барбершоп Алиби в Краснодаре — стрижки и борода'
          description='Мужские стрижки, оформление бороды и комбо в Алиби. Краснодар, ул. Воронежская, 47/14, ЖК «Фонтаны». Часы работы 11:00–22:00. Запись онлайн.'
          for attrs in [{'name':'description','content':description},{'property':'og:type','content':'website'},{'property':'og:site_name','content':'Алиби'},{'property':'og:locale','content':'ru_RU'},{'property':'og:title','content':soup.title.string},{'property':'og:description','content':description},{'name':'twitter:card','content':'summary'},{'name':'twitter:title','content':soup.title.string},{'name':'twitter:description','content':description}]:
              soup.head.append(soup.new_tag('meta',attrs=attrs))
          schema={'@context':'https://schema.org','@type':'HealthAndBeautyBusiness','name':'Алиби','telephone':'+79615252549','address':{'@type':'PostalAddress','streetAddress':'ул. Воронежская, 47/14, ЖК «Фонтаны»','addressLocality':'Краснодар','addressCountry':'RU'},'openingHoursSpecification':[{'@type':'OpeningHoursSpecification','dayOfWeek':['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],'opens':'11:00','closes':'22:00'}]}
          offers=[]
          for group in soup.select('.price-group'):
              for row in group.select('.price-line'):
                  price=re.sub(r'\D','',row.select_one('.price-amount').get_text())
                  offers.append({'@type':'Offer','price':price,'priceCurrency':'RUB','itemOffered':{'@type':'Service','name':row.span.get_text()+' — '+group.h3.get_text()}})
          schema['hasOfferCatalog']={'@type':'OfferCatalog','name':'Услуги Алиби','itemListElement':offers}
          ld=soup.new_tag('script',attrs={'type':'application/ld+json'})
          ld.string=json.dumps(schema,ensure_ascii=False)
          soup.head.append(ld)
          old=soup.select_one('.guest-reviews')
          old['class']=['reviews-carousel']
          old['role']='region'
          old['aria-roledescription']='карусель'
          old['aria-label']='Отзывы гостей'
          for i,review in enumerate(reviews):
              review['role']='group'
              review['aria-roledescription']='слайд'
              review['aria-label']=str(i+1)+' из 6'
          track=soup.new_tag('div',attrs={'class':'carousel-track','id':'reviewsTrack','tabindex':'0','aria-label':'Листайте отзывы стрелками клавиатуры или свайпом'})
          for review in reviews: track.append(review.extract())
          old.append(track)
          controls=soup.new_tag('div',attrs={'class':'carousel-controls','hidden':''})
          for direction,label,symbol in [('-1','Предыдущий отзыв','‹'),('1','Следующий отзыв','›')]:
              button=soup.new_tag('button',attrs={'type':'button','class':'carousel-btn','data-direction':direction,'aria-label':label})
              button.string=symbol
              controls.append(button)
          status=soup.new_tag('span',attrs={'class':'carousel-status','aria-live':'polite','aria-atomic':'true'})
          status.string='1 / 6'
          controls.insert(1,status)
          old.append(controls)
          js="(()=>{const t=document.getElementById('reviewsTrack'),r=t.closest('.reviews-carousel'),slides=[...t.children],status=r.querySelector('.carousel-status'),motion=matchMedia('(prefers-reduced-motion: reduce)');let index=0;const update=()=>{index=Math.max(0,Math.min(slides.length-1,Math.round(t.scrollLeft/t.clientWidth)));status.textContent=(index+1)+' / '+slides.length;};const go=i=>{index=(i+slides.length)%slides.length;t.scrollTo({left:index*t.clientWidth,behavior:motion.matches?'instant':'smooth'});};r.querySelector('.carousel-controls').hidden=false;r.querySelectorAll('[data-direction]').forEach(b=>b.addEventListener('click',()=>go(index+Number(b.dataset.direction))));t.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();go(index+(e.key==='ArrowRight'?1:-1));}});t.addEventListener('scroll',update,{passive:true});new ResizeObserver(()=>{t.scrollTo({left:index*t.clientWidth,behavior:'instant'});}).observe(t);})();"
          script=soup.new_tag('script');script.string=js;soup.body.append(script)
          logo=soup.select_one('.brand img')
          logo['width']='228';logo['height']='312';logo['decoding']='async'
          for node in soup.find_all(string=True):
              if node.parent.name not in ['script','style'] and ('ВЕРСИЯ 17' in node or 'Демо-версия 17' in node):
                  node.replace_with(str(node).replace('ВЕРСИЯ 17','ВЕРСИЯ 18').replace('Демо-версия 17','Демо-версия 18'))
          css=c.read_text(encoding='utf-8')+'\n.reviews-carousel{min-width:0}.carousel-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}.carousel-track::-webkit-scrollbar{display:none}.carousel-track>.guest-review{box-sizing:border-box;flex:0 0 100%;min-width:0;margin:0;scroll-snap-align:start;overflow-wrap:anywhere;padding:clamp(20px,3vw,36px)}.carousel-controls:not([hidden]){display:flex;align-items:center;justify-content:center;gap:20px;margin-top:18px}.carousel-btn{min-width:44px;min-height:44px;border:1px solid #c2a56a;border-radius:50%;background:transparent;color:#c2a56a;font-size:26px;cursor:pointer}.carousel-status{font-variant-numeric:tabular-nums}a:focus-visible,button:focus-visible,.carousel-track:focus-visible{outline:2px solid #c2a56a;outline-offset:4px}.grid>*,.contacts-grid>*{min-width:0}img{max-width:100%}.map{max-width:100%}@media(max-width:760px){.reviews .grid{grid-template-columns:minmax(0,1fr)}.actions{flex-wrap:wrap}.carousel-track>.guest-review p{font-size:18px;line-height:1.65}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\n'
          s=soup.decode(formatter='html')
          parser=html5lib.HTMLParser(strict=False);parser.parse(s)
          assert not parser.errors,parser.errors
          json.loads(str(ld.string))
          assert len(soup.select('.guest-review'))==6 and len(offers)==6
          root=Path.cwd().resolve()
          def embed(path):
              f=(root/path).resolve()
              assert f.is_relative_to(root/'assets') and f.is_file()
              return 'data:'+{'.woff':'font/woff','.png':'image/png'}[f.suffix]+';base64,'+base64.b64encode(f.read_bytes()).decode()
          packed=re.sub(r'url\((assets/[^)]+)\)',lambda m:'url('+embed(m.group(1))+')',css)
          preview=BeautifulSoup(s,'html5lib')
          link=preview.find('link',rel='stylesheet')
          style=preview.new_tag('style');style.string=packed;link.replace_with(style)
          for image in preview.find_all('img',src=True):
              if image['src'].startswith('assets/'):image['src']=embed(image['src'])
          final=preview.decode(formatter='html')
          parser.parse(final);assert not parser.errors,parser.errors
          p.write_text(s,encoding='utf-8');c.write_text(css,encoding='utf-8')
          Path('dist').mkdir(exist_ok=True)
          Path('dist/alibi-preview.html').write_text(final,encoding='utf-8')
          Path('dist/v18-validation.json').write_text(json.dumps({'html5_parser_errors':parser.errors,'reviews':6,'offers':6,'note':'HTML5 parsing checked; full conformance and browser layout require separate validation.'},ensure_ascii=False,indent=2),encoding='utf-8')
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css dist/alibi-preview.html dist/v18-validation.json
          git commit -m 'Build v18 carousel, metadata and HTML5 parser report'
          git push origin HEAD:main
