<link rel="canonical" href="https://shurhoveckyvadim-creator.github.io/Alibi/">
<link rel="icon" href="assets/images/logo.png" type="image/png">
<link rel="stylesheet" href="styles.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BarberShop",
  "name": "Алиби",
  "description": "Барбершоп Алиби в Краснодаре: мужские стрижки, оформление бороды и комбо.",
  "url": "https://shurhoveckyvadim-creator.github.io/Alibi/",
  "telephone": "+79615252549",
  "image": "https://shurhoveckyvadim-creator.github.io/Alibi/assets/images/logo.png",
  "priceRange": "₽₽",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "ул. Воронежская, 47/14, ЖК «Фонтаны»",
    "addressLocality": "Краснодар",
    "addressCountry": "RU"
  },
  "geo": {"@type": "GeoCoordinates", "latitude": 45.035554, "longitude": 38.975284},
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
    "opens": "11:00",
    "closes": "22:00"
  }],
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Услуги барбершопа Алиби",
    "itemListElement": [
      {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Мужская стрижка, младший барбер"}, "price": "1000", "priceCurrency": "RUB"},
      {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Оформление бороды, младший барбер"}, "price": "500", "priceCurrency": "RUB"},
      {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Стрижка и борода, младший барбер"}, "price": "1500", "priceCurrency": "RUB"},
      {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Мужская стрижка, старший барбер"}, "price": "1700", "priceCurrency": "RUB"},
      {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Оформление бороды, старший барбер"}, "price": "900", "priceCurrency": "RUB"},
      {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Стрижка и борода, старший барбер"}, "price": "2600", "priceCurrency": "RUB"}
    ]
