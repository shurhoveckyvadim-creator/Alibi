name: Alibi v18 carousel SEO and valid HTML
on:
  push:
    branches: [main]
    paths: ['.github/workflows/content-v18.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          import re,html,json,base64
          p,c=Path('index.html'),Path('styles.css')
          s,css=p.read_text(encoding='utf-8'),c.read_text(encoding='utf-8')
          assert '<title>Алиби — демо лендинга · v17</title>' in s
          assert s.count('class="guest-review"')==6
          def sub(a,b,n=1):
              global s
              assert s.count(a)==n,(a,s.count(a))
              s=s.replace(a,b)
          sub('<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151e38"><title>Алиби — демо лендинга · v17</title><link rel="stylesheet" href="styles.css"></head><body>','''<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151e38">
<title>Барбершоп Алиби в Краснодаре — стрижки, борода, запись онлайн</title>
<meta name="description" content="Барбершоп Алиби в Краснодаре: мужские стрижки, оформление бороды и комбо. ул. Воронежская, 47/14, ЖК «Фонтаны». Запись онлайн ежедневно с 11:00 до 22:00.">
<meta name="keywords" content="барбершоп Алиби, барбершоп Краснодар, мужская стрижка Краснодар, оформление бороды, стрижка и борода, ЖК Фонтаны">
